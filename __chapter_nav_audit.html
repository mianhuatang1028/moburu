<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>audit</title>
<style>html,body{margin:0}iframe{width:390px;height:900px;border:0;position:absolute;left:-9999px}</style>
</head><body>
<pre id="out">running</pre>
<iframe id="f"></iframe>
<script>
var cases = [["reader.html?work=henchangsha&ch=1", "中间章"], ["reader.html?work=henchangsha&ch=0", "首章"], ["reader.html?work=henchangsha&ch=52", "末章"]];
var langs = ["zh", "en", "ja", "fr", "ar"];
var W = 390;
document.getElementById("f").style.width = W + "px";
var queue = [];
langs.forEach(function (l) { cases.forEach(function (c) { queue.push({ l: l, p: c[0], note: c[1] }); }); });
var out = [], idx = 0;

function label(el) {
  var c = (typeof el.className === "string") ? el.className.trim().split(/\s+/).join(".") : "";
  return el.tagName.toLowerCase() + (c ? "." + c : "");
}

/* 文字实际矩形是否越过自身内容框（判断标签被切） */
function textBeyond(el) {
  var rect = el.getBoundingClientRect();
  var cs = window.getComputedStyle(el);
  var padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
  var innerL = rect.left + padL, innerR = rect.right - padR;
  var worstR = 0, worstL = 0;
  for (var n = 0; n < el.childNodes.length; n++) {
    var node = el.childNodes[n];
    if (node.nodeType !== 3 || !node.nodeValue.trim()) continue;
    var rg = document.createRange();
    rg.selectNodeContents(node);
    var boxes = rg.getClientRects();
    for (var b = 0; b < boxes.length; b++) {
      if (boxes[b].width < 1) continue;
      if (boxes[b].right > innerR + 1) worstR = Math.max(worstR, boxes[b].right - innerR);
      if (boxes[b].left < innerL - 1) worstL = Math.max(worstL, innerL - boxes[b].left);
    }
  }
  return { left: worstL, right: worstR };
}

function step() {
  if (idx >= queue.length) {
    document.getElementById("out").textContent = out.join("\n");
    document.title = "DONE";
    return;
  }
  var job = queue[idx], f = document.getElementById("f");
  try { localStorage.setItem("moburu_lang", job.l); } catch (e) {}
  f.onload = function () {
    var d = f.contentDocument, w = f.contentWindow, de = d.documentElement;
    var problems = [];
    var nav = d.querySelector(".ch-nav");
    if (!nav) {
      out.push("FAIL [" + job.l + "] " + job.p + " 没有翻页条");
      idx++; setTimeout(step, 60); return;
    }
    var vis = [].slice.call(nav.querySelectorAll(".ch-nav-btn")).filter(function (el) {
      return w.getComputedStyle(el).display !== "none";
    });
    // 1) 页面不能被翻页条顶出横向滚动条
    if (de.scrollWidth > de.clientWidth + 1) {
      problems.push("页面横向溢出 " + (de.scrollWidth - de.clientWidth) + "px");
    }
    // 2) 三个格子不能重叠
    var rects = vis.map(function (el) { return el.getBoundingClientRect(); });
    for (var a = 0; a < rects.length - 1; a++) {
      for (var b = a + 1; b < rects.length; b++) {
        var A = rects[a], B = rects[b];
        var ox = Math.min(A.right, B.right) - Math.max(A.left, B.left);
        var oy = Math.min(A.bottom, B.bottom) - Math.max(A.top, B.top);
        if (ox > 1 && oy > 1) problems.push("第" + (a + 1) + "与第" + (b + 1) + "格重叠 " + ox.toFixed(1) + "px");
      }
    }
    // 3) 「上一章 / 下一章」小标签必须完整可见（不能用省略号把它们吃掉）
    var keys = nav.querySelectorAll(".ch-nav-k");
    for (var k = 0; k < keys.length; k++) {
      var o = textBeyond(keys[k]);
      if (o.right > 1 || o.left > 1) {
        problems.push("标签被切 " + Math.max(o.left, o.right).toFixed(1) + "px: \"" + keys[k].textContent.trim() + "\"");
      }
    }
    // 4) 可点面积：手机上手点得中（高度 >= 40px）
    for (var v = 0; v < vis.length; v++) {
      if (vis[v].tagName !== "A") continue;
      if (rects[v].height < 40) problems.push("点击区过矮 " + rects[v].height.toFixed(0) + "px");
      if (rects[v].width < 60) problems.push("点击区过窄 " + rects[v].width.toFixed(0) + "px");
    }
    // 5) 首末章的灰态必须真的不可点（没有 href）
    var offs = nav.querySelectorAll(".is-off");
    for (var q = 0; q < offs.length; q++) {
      if (offs[q].tagName === "A" || offs[q].hasAttribute("href")) problems.push("灰态按钮仍可点击");
    }
    // 6) 该出现几个格子
    if (W <= 560) {
      if (vis.length !== 2 && job.l === "zh") problems.push("手机端应只剩上一章/下一章两个格子，实际 " + vis.length);
    } else if (vis.length < 2) {
      problems.push("格子数异常 " + vis.length);
    }
    // 7) 翻页条的箭头方向（RTL 由 CSS 镜像，这里只查箭头字符是否在）
    if (!nav.innerHTML.match(/[\u2039\u203A]/)) problems.push("缺箭头字符");

    if (problems.length) out.push("FAIL [" + job.l + "·" + W + "px] " + job.p + " (" + job.note + ") " + problems.join(" / "));
    else out.push("OK   [" + job.l + "·" + W + "px] " + job.p + " (" + job.note + ") 格子=" + vis.length);
    idx++;
    setTimeout(step, 60);
  };
  f.src = job.p;
}
step();
</script>
</body></html>
